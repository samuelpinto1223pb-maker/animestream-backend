name: Auto Extractor de Anime

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalación de dependencias
        run: npm install

      - name: Ejecutar script extractor
        run: node scripts/extractor.js

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latino.json || true
          git commit -m "Actualización automática de catálogo latino" || true
          git push
