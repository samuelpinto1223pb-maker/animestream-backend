name: Auto Extractor de Anime

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Se ejecutará automáticamente cada domingo a medianoche

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node scripts/extractor.js
      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add latino.json
          git commit -m "Auto-actualización de catálogo de animes" || exit 0
          git push
