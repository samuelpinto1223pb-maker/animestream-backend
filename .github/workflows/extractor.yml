name: Auto Extractor de Animes y Peliculas 2026

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar Extractor
        run: node scripts/extractor.js

      - name: Guardar cambios en latino.json
        run: |
          git config --global user.name 'Bot Extractor'
          git config --global user.email 'bot@github.com'
          git add latino.json
          git commit -m "Auto-update: Nuevos datos en latino.json" || exit 0
          git push
