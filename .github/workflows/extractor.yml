name: Auto Actualización de Catálogo

on:
  schedule:
    # Programado para cada domingo a las 03:00 UTC (3:00 AM)
    - cron: '0 3 * * 0'
  workflow_dispatch: # Permite activarlo manualmente desde GitHub si quieres

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar extractor en modo sigilo
        run: node scripts/extractor.js

      - name: Guardar cambios y subir latino.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latino.json
          git commit -m "Auto-actualización de catálogo de animes (Latino/Castellano/Años)" || exit 0
          git push
